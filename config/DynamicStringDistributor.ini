[General]
; Allow translations to change the player's own name.
bEnablePlayerRef = false
; Seconds between condition re-evaluation (scaled by game time). 0 or negative disables updates.
fUpdateInterval = 5.0
; Translate crosshair prompts (ACTI/FLOR/FURN ATTX). Set to false if the game crashes when you look at objects.
bActivateTextHooks = true

; Translate player dialogue options in the vanilla wheel and in XDI. Set to false if the game crashes when dialogue options appear.
bDialogueOptionHooks = true

[Debug]
; Write detailed (trace) log output.
bEnableDebugLog = false
; Prefix every replaced text with "FormID|Plugin|".
bEnableDebugInfo = false
